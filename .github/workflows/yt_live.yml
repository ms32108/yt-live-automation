name: Automated YouTube Live Stream

on:
  schedule:
    - cron: '20 1 * * *'  # Runs every day at 6:50 AM IST
    - cron: '20 11 * * *' # Runs every day at 4:50 PM IST
  workflow_dispatch:

jobs:
  stream-video:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ffmpeg-ubuntu-24

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Video from Google Drive
        run: |
          pipx run gdown 1dcJyK6LsVLJymqRa2RH2TxaCS299BfFz -O video.mp4

      - name: Stream to YouTube
        env:
          KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg -re -stream_loop 1 -fflags +genpts -i video.mp4 \
          -c:v copy \
          -c:a copy \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY"
