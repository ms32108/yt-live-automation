name: Automated YouTube Live Stream

on:
  schedule:
    # 3:30 PM UTC is 9:00 PM IST. 
    # (GitHub often delays this by 20+ minutes)
    - cron: '45 15 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stream-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Video from Google Drive
        run: |
          # Use --confirm-full to bypass the 500MB virus scan warning page
          pipx run gdown --id 1wntPFRjpTjtRau3Sr1Ts_nSr3Qy8Lf7u -O video.mp4 --confirm-full

      - name: Verify Video File
        run: |
          ls -lh video.mp4
          FILESIZE=$(stat -c%s "video.mp4")
          # Check if file is at least 400MB (419430400 bytes)
          if [ $FILESIZE -lt 419430400 ]; then
            echo "Error: Download failed. File is too small. Check GDrive permissions."
            exit 1
          fi

      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # Optimized for 500MB file streaming to YouTube
          ffmpeg -re -i video.mp4 \
          -c:v libx264 -preset veryfast -b:v 3000k \
          -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -ar 44100 -b:a 128k \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
